# Exercise 7.3 — Quality gate: chạy eval trên golden dataset, fail nếu accuracy < 85% hoặc có regression.
# run_eval.py trả exit code 1 khi không đạt → job fail → PR không merge được
# (đặt job này làm "required status check" cho nhánh main trong Branch protection).
name: quality-gate
on:
  pull_request:
  push:
    branches: [main]

jobs:
  eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 06-lab-complete/benchmark-observability/develop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Start agent v2 (lỗi upstream = 0 để eval ổn định)
        run: |
          AGENT_VERSION=v2 MOCK_ERROR_RATE=0 PORT=8000 python app.py &
          for i in $(seq 1 20); do curl -sf http://localhost:8000/health && break; sleep 1; done
      - name: Eval + quality gate
        run: python eval/run_eval.py --url http://localhost:8000 --min-accuracy 0.85 --out reports/eval_ci.json
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: 06-lab-complete/benchmark-observability/develop/reports/eval_ci.json
