# Render Blueprint — agent (Docker) + Redis (Key Value).
# Render đọc file này khi tạo Blueprint; rootDir trỏ vào thư mục Part 6.
services:
  - type: web
    name: day14-agent
    runtime: docker
    rootDir: 06-lab-complete
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"
      - key: AGENT_API_KEY
        generateValue: true          # Render tự sinh secret, không ghi giá trị trong repo
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: day14-redis
          property: connectionString

  - type: keyvalue
    name: day14-redis
    plan: free
    ipAllowList: []                  # chỉ service trong cùng tài khoản Render truy cập được
